[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
nodejs = ">=26.10.0"
ruff = ">=0.17.1"
openvino = "*"
intel-ipp = "*"
llvmlite = ">=0.50.0,<0.51"
pydantic = ">=2.14.1,<3"

[pypi-dependencies]
onnxruntime-openvino = "*"
pydantic-ai = ">=2.38.0, <3"
google-genai = ">=2.32.0, <3"
openai = ">=3.3.0, <4"
langgraph = ">=1.2.16, <2"
crewai = ">=1.6.1, <2"
faiss-cpu = ">=1.15.1, <2"

[feature.dev.dependencies]
pytest = "*"

[environments]
default = ["dev"]
