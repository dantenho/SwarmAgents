[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
nodejs = ">=26.10.0"
ruff = ">=0.17.1"
openvino = "*"
intel-ipp = "*"
llvmlite = ">=0.50.0,<0.51"
pydantic = ">=2.14.1,<3"

[pypi-dependencies]
onnxruntime-openvino = "*"

[feature.dev.dependencies]
pytest = "*"

[environments]
default = ["dev"]
