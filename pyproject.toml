[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SwarmAgents"
version = "0.1.0"
description = "Python repository for SwarmAgents - agents and examples"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.15"

dependencies = [
    "httpx2==2.13.1",
    "uvloop==0.23.0",
    "fastapi==0.143.3",
    "onnxruntime==1.31.0",
    "onnxruntime-openvino==1.24.1",
    "SQLAlchemy==2.1.5",
    "polars==2.0.0",
    "grpcio==1.84.0",
    "pyarrow==26.0.0",
    "numpy==2.5.4",
    "sympy==1.14.0",
    "langextract==1.7.1",
    "langsmith>=0.14",
    "faiss-cpu==1.15.1",
    "pgvector==0.5.1",
    "sentence-transformers==6.1.0",
    "transformers==5.20.1",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
    "langchain-anthropic==1.7.6",
    "langchain-community==0.4.2",
    "langgraph==1.2.16",
]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.feature.node.dependencies]
node = ">=26.11.1"
npm = ">=11"

[tool.pixi.feature.rust.dependencies]
rust = ">=1.99"
maturin = ">=1"

[tool.pixi.environments]
default = { features = ["node", "rust"] }
